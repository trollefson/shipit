[package]
name = "shipit"
version = "1.4.3"
edition = "2024"
license = "MIT"
description = "Shipit is an open source command line interface for managing merge requests, changelogs, tags, and releases using a plan and apply interface. Built with coding agent integration in mind."
repository = "https://github.com/trollefson/shipit"
authors = ["Tanner Rollefson"]

[dependencies]
clap = { version = "4.5.55", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
git2 = "0.20.4"
gitlab = "0.1808.0"
serde = { version = "1.0.228", features = ["derive"] }
confy = "2.0.0"
octocrab = "0.41"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
owo-colors = "4"
regex = "1"
clap-markdown = "0.1.5"
chrono = "0.4"
serde_yaml = "0.9"
async-trait = "0.1"
indicatif = "0.17"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
mockall = "0.13"
